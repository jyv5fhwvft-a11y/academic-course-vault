<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ CS 301: Advanced OS // Interactive Simulation Laboratory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-base: #06080e;
            --bg-card: #0b0f19;
            --bg-hover: #16222f;
            --bg-code: #020408;
            --stroke-glass: rgba(255, 255, 255, 0.08);
            --ink-bright: #ffffff;
            --ink-secondary: #e2e8f0;
            --ink-muted: #64748b;
            --neon-emerald: #50fa7b;
            --neon-cyan: #8be9fd;
            --neon-blue: #6366f1;
            --font-sans: system-ui, -apple-system, sans-serif;
            --font-mono: monospace;
        }
        body { 
            background-color: var(--bg-base); 
            color: var(--ink-secondary); 
            font-family: var(--font-sans); 
            padding: 40px 24px; 
            line-height: 1.6;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        .wrapper { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        header { border-bottom: 1px solid var(--stroke-glass); padding-bottom: 20px; }
        .lab-badge { font-family: var(--font-mono); font-size: 0.75rem; color: var(--neon-emerald); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; display: inline-block; margin-bottom: 8px; }
        h1 { color: var(--ink-bright); font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
        .lab-desc { color: var(--ink-muted); margin-top: 6px; font-size: 1rem; max-width: 750px; }
        
        /* TIMELINE SELECTOR CONTROLS */
        .selector-deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; background: var(--bg-card); padding: 12px; border-radius: 10px; border: 1px solid var(--stroke-glass); }
        .lecture-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--stroke-glass); color: var(--ink-secondary); padding: 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s ease; }
        .lecture-btn:hover { border-color: var(--neon-cyan); background: var(--bg-hover); color: var(--ink-bright); }
        .lecture-btn.active { background: var(--neon-blue); border-color: var(--ink-bright); color: var(--ink-bright); box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
        
        /* TARGET PANEL STYLING */
        .simulation-stage { display: flex; flex-direction: column; gap: 20px; margin-top: 12px; }
        .substrate-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg-code); padding: 6px; border-radius: 8px; border: 1px solid var(--stroke-glass); }
        .toggle-btn { background: transparent; border: none; color: var(--ink-muted); padding: 10px; border-radius: 6px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; }
        .toggle-btn.active { background: var(--neon-blue); color: var(--ink-bright); }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="lab-badge">🧬 FULL-STACK SYSTEMS SIMULATION LABORATORY HUB</div>
            <h1>CS 301: Interactive Architecture Engine</h1>
            <p class="lab-desc">Central sandbox runtime array executing cross-functional kernel tracking matrices. Toggle between high-relatability 5th-grader conceptual analog hooks and low-level supervisor privilege ring hardware traces.</p>
        </header>
