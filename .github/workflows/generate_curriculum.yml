name: 🛠️ Automated Course Vault Curriculum Generator Pipeline
on:
  repository_dispatch:
    types: [agent_deploy_payload]

jobs:
  write_course_assets:
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Checkout Repository Substrate Core
        uses: actions/checkout@v4

      - name: ⚙️ Set Up File Writing Environment
        run: |
          mkdir -p .

      - name: 📝 Write Production File Assets to Root Space
        run: |
          echo '${{ github.event.client_payload.file_contents }}' > '${{ github.event.client_payload.file_name }}'

      - name: 🚀 Commit and Push Complete Deliverables Live
        run: |
          git config --global user.name "Academic-Course-Tutor[Bot]"
          git config --global user.email "agent-bot@github.com"
          git add .
          git commit -m "🚀 [Automated Agent Deployment] Added/Updated ${{ github.event.client_payload.file_name }}" || exit 0
          git push origin main
